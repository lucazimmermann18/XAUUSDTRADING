<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Sniper · 17 Märkte</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Lightweight Charts from CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- ─── Top Bar ─────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar__logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">ICT <span class="logo-accent">SNIPER</span></span>
    </div>

    <div class="topbar__instruments" id="inst-categories">
      <!-- Category tabs rendered by app.js -->
    </div>

    <div class="topbar__price">
      <span class="live-dot" id="live-dot"></span>
      <span class="live-label">LIVE</span>
      <span class="current-price" id="current-price">–</span>
    </div>
    <a href="/journal" class="journal-nav-btn">📒 Journal</a>
  </header>

  <!-- ─── Instrument Chips Bar ──────────────────────────────────────────────── -->
  <div class="inst-chips-bar" id="inst-chips-bar">
    <!-- Instrument chips rendered by app.js -->
  </div>

  <!-- ─── Main Content ─────────────────────────────────────────────────────── -->
  <main class="main">

    <!-- Capital input + Analyse button -->
    <div class="controls">
      <div class="capital-group">
        <label class="capital-label" for="capital-input">Kapital</label>
        <div class="capital-input-wrap">
          <span class="currency-prefix">€</span>
          <input
            type="number"
            id="capital-input"
            class="capital-input"
            value="1000"
            min="100"
            step="100"
            placeholder="1000"
          />
        </div>
      </div>

      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">M1 · 200 Kerzen geladen</span>
      </div>

      <button class="analyse-btn" id="analyse-btn">
        <span class="analyse-icon">⚡</span>
        Analysieren
      </button>
    </div>

    <!-- Chart container -->
    <div class="chart-wrapper">
      <div id="chart-container"></div>
      <div class="chart-overlay" id="chart-loading">
        <div class="spinner"></div>
        <span>Marktdaten werden geladen…</span>
      </div>
    </div>

    <!-- Trade card output -->
    <div class="card-output" id="card-output">
      <!-- Trade card injected here by trade-card.js -->
      <div class="card-placeholder" id="card-placeholder">
        <div class="placeholder-icon">◈</div>
        <p>Klicke auf <strong>Analysieren</strong> um eine ICT-Analyse zu starten</p>
      </div>
    </div>

    <!-- AI Commentary panel (injected after analysis) -->
    <div id="ai-panel-container"></div>

  </main>

  <!-- ─── Scripts ──────────────────────────────────────────────────────────── -->
  <script src="/js/instruments.js"></script>
  <script src="/js/journal-store.js"></script>
  <script src="/js/ai-commentator.js"></script>
  <script src="/js/websocket-client.js"></script>
  <script src="/js/ict-analyzer.js"></script>
  <script src="/js/trade-card.js"></script>
  <script src="/js/chart-manager.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
